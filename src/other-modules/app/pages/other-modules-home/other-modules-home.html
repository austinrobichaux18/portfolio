<section class="page-container other-modules-page">
  <header class="page-header">
    <h1>Other Modules</h1>
    <p>
      These are modules I've made for personal use, personal education, or as tools for
      friends, family, and people I've met that these tools could help.
    </p>
  </header>

  <div class="module-grid">
    @for (m of modules; track m.id) {
      <a class="module-card" [routerLink]="['/other-modules', m.route]">
        <h2>{{ m.title }}</h2>
        <p>{{ m.description }}</p>
        <p class="last-updated">Last updated: {{ m.lastUpdated | date: 'MMM d, y' }}</p>
      </a>
    }
  </div>
</section>
