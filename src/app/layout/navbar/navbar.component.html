<header class="navbar">

    <a routerLink="/" class="logo" (click)="menuOpen = false">
        <span class="logo-mark">
            AR
        </span>

        <span>
            Austin Robichaux
        </span>
    </a>

    <button
        type="button"
        class="menu-toggle"
        (click)="menuOpen = !menuOpen"
        [attr.aria-expanded]="menuOpen"
        aria-controls="primary-nav"
        aria-label="Toggle navigation menu"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="primary-nav" [class.open]="menuOpen">

        <a routerLink="/experience" (click)="menuOpen = false">
            Experience
        </a>

        <a routerLink="/projects" (click)="menuOpen = false">
            Projects
        </a>

        <a routerLink="/games" (click)="menuOpen = false">
            Indie
        </a>

        <a routerLink="/contact" (click)="menuOpen = false">
            Contact
        </a>

        <a routerLink="/resume" class="resume-link" (click)="menuOpen = false">
            Resume
        </a>
    </nav>

</header>
