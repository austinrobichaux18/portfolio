<article class="project-card">

    @if(project.status) {

        <span class="status">
            {{ project.status }}
        </span>

    }

    <h3>

        {{ project.title }}

    </h3>

    <p>

        {{ project.description }}

    </p>

    <div class="tags">

        @for(tag of project.tags; track tag) {

            <span>
                {{ tag }}
            </span>

        }

    </div>

    @if(project.result) {

        <p class="result">
            {{ project.result }}
        </p>

    }

    @if(project.link) {

        @if(isExternalLink) {

            <a class="case-study" [href]="project.link" target="_blank" rel="noopener">
                View Case Study
            </a>

        } @else {

            <a class="case-study" [routerLink]="project.link">
                View Case Study
            </a>

        }

    }

</article>
